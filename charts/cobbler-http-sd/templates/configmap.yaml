apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cobbler-http-sd.fullname" . }}
  labels:
    {{- include "cobbler-http-sd.labels" . | nindent 4 }}
data:
  CACHE_TTL_SECONDS: {{ .Values.env.cacheTtlSeconds | toString | quote }}
  COBBLER_SERVERS_CONFIG_PATH: "/etc/cobbler-http-sd/servers.json"
  LISTEN_PORT: {{ .Values.service.port | toString | quote }}
