apiVersion: v1
kind: Service
metadata:
  labels: {{- include "cobbler-http-sd.labels" . | nindent 4 }}
  name: {{ include "cobbler-http-sd.fullname" . }}
spec:
  ports:
    - name: http
      port: {{ .Values.service.port }}
      protocol: TCP
      targetPort: http
  selector: {{- include "cobbler-http-sd.selectorLabels" . | nindent 4 }}
  type: {{ .Values.service.type }}
