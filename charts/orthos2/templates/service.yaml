apiVersion: v1
kind: Service
metadata:
  name: {{ include "orthos2.fullname" . }}
  labels:
    {{- include "orthos2.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "orthos2.selectorLabels" . | nindent 4 }}
    app-component: web
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "orthos2.fullname" . }}-static
  labels:
    {{- include "orthos2.labels" . | nindent 4 }}
    app-component: static
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: 80
      targetPort: static-http
      protocol: TCP
      name: static
  selector:
    {{- include "orthos2.selectorLabels" . | nindent 4 }}
    app-component: static
