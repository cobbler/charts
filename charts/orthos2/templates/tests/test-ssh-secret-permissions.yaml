apiVersion: v1
kind: Secret
metadata:
  name: "{{ include "orthos2.fullname" . }}-test-ssh-secret"
  labels:
    {{- include "orthos2.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": hook-succeeded
type: Opaque
stringData:
  config: |
    Host *
      StrictHostKeyChecking no
  master: "test-fixture-not-a-real-key"
---
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "orthos2.fullname" . }}-test-ssh-secret-permissions"
  labels:
    {{- include "orthos2.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": hook-succeeded
    ignore-check.kube-linter.io/default-service-account: "This is a Helm test container"
    ignore-check.kube-linter.io/no-liveness-probe: "This is a Helm test container"
    ignore-check.kube-linter.io/no-readiness-probe: "This is a Helm test container"
    ignore-check.kube-linter.io/restart-policy: "This is a Helm test container"
spec:
  restartPolicy: Never
  {{- with .Values.podSecurityContext }}
  securityContext:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: check-ssh-secret-permissions
      # Uses the real orthos2 image (not a generic busybox) since it's the
      # image whose glibc/coreutils/userdb behavior actually matters here -
      # a minimal busybox image could pass or fail this check for reasons
      # unrelated to the orthos2 image's own /etc/passwd and permission
      # handling.
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      # Only the identity fields matter for this test - unlike
      # .Values.securityContext (reused as-is by the taskmanager container),
      # this container needs no added capabilities (e.g. NET_RAW, which this
      # container never uses) to check file readability.
      securityContext:
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: {{ .Values.securityContext.readOnlyRootFilesystem }}
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsGroup: {{ .Values.securityContext.runAsGroup }}
      command:
        - sh
        - -c
        - |
          set -e
          id
          found=0
          for f in $(find /var/lib/orthos2/.ssh -type f); do
            found=1
            if cat "$f" > /dev/null; then
              echo "OK: $f is readable"
            else
              echo "FAIL: $f is not readable" >&2
              exit 1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "FAIL: no files found in /var/lib/orthos2/.ssh" >&2
            exit 1
          fi
      volumeMounts:
        - name: ssh-config
          readOnly: true
          mountPath: /var/lib/orthos2/.ssh
  volumes:
    - name: ssh-config
      secret:
        secretName: "{{ include "orthos2.fullname" . }}-test-ssh-secret"
        {{- if .Values.sshSecretItems }}
        items:
          {{- toYaml .Values.sshSecretItems | nindent 10 }}
        {{- else }}
        defaultMode: {{ .Values.sshSecretDefaultMode }}
        {{- end }}
