---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
        ignore-check.kube-linter.io/run-as-non-root: "nginx upstream not configured for non-root execution"
        ignore-check.kube-linter.io/privileged-ports: "nginx upstream not configured for non-root execution"
  name: {{ include "orthos2.fullname" . }}-static
  labels:
    {{- include "orthos2.labels" . | nindent 4 }}
    app-component: static
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "orthos2.selectorLabels" . | nindent 6 }}
      app-component: static
  template:
    metadata:
      labels:
        {{- include "orthos2.labels" . | nindent 8 }}
        app-component: static
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      restartPolicy: Always
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "orthos2.serviceAccountName" . }}
      containers:
        - name: {{ .Chart.Name }}-static
          securityContext:
            readOnlyRootFilesystem: true
          image: "{{ .Values.image.repositoryStatic }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: static-http
              containerPort: 80
              protocol: TCP
          livenessProbe:  
            httpGet:
              path: /
              port: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
