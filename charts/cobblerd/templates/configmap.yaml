apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cobblerd.fullname" . }}
  labels:
    {{- include "cobblerd.labels" . | nindent 4 }}
data:
  settings.yaml: |
    {{- toYaml .Values.settings | nindent 4 }}
  # Overrides the RPM-shipped /etc/cobbler/logging_config.conf: containers log
  # to stdout, not to a file that would need its own volume/rotation.
  logging_config.conf: |
    [loggers]
    keys=root

    [handlers]
    keys=stdout

    [formatters]
    keys=stdout

    [logger_root]
    level={{ .Values.logging.level }}
    handlers=stdout

    [handler_stdout]
    class=StreamHandler
    level={{ .Values.logging.level }}
    formatter=stdout
    args=(sys.stdout,)

    [formatter_stdout]
    format=%(levelname)s | %(message)s
    class=logging.Formatter
